services:
  db:
    image: postgres:16-alpine
    container_name: krl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krl_prod}
      POSTGRES_USER: ${POSTGRES_USER:-krl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krl_user} -d ${POSTGRES_DB:-krl_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - krl-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: krl-app:latest
    container_name: krl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://krl.mamay.my.id}
      DATABASE_URL: postgresql://${POSTGRES_USER:-krl_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krl_prod}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-3600}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - krl-network

networks:
  krl-network:
    name: krl-network
    driver: bridge
